name: SSI FastConnect V3 offline checks

on:
  pull_request:
    paths:
      - "src/ingest/ssi_fastconnect_v3.py"
      - "scripts/ssi_v3_sync.py"
      - "tests/test_ssi_fastconnect_v3.py"
      - ".github/workflows/ssi-v3-checks.yml"
  push:
    branches: ["main"]
    paths:
      - "src/ingest/ssi_fastconnect_v3.py"
      - "scripts/ssi_v3_sync.py"
      - "tests/test_ssi_fastconnect_v3.py"

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only integration test dependencies
        run: python -m pip install "requests>=2.31,<3" "pandas>=2.1,<3" "pytest>=8,<10"
      - name: Test without network or API credentials
        env:
          SSI_API_KEY: ""
          SSI_API_SECRET: ""
        run: python -m pytest -q tests/test_ssi_fastconnect_v3.py
